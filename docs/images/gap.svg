  <path d="M65.00,243.00 L61.40,234.00 L68.60,234.00 Z" fill="#7A1F2B"/>
  <text x="57.00" y="240.00" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#7A1F2B" text-anchor="end" font-weight="600">left</text>
  <line x1="435.00" y1="227.00" x2="435.00" y2="243.00" stroke="#7A1F2B" stroke-width="1.2"/>
  <path d="M435.00,227.00 L438.60,236.00 L431.40,236.00 Z" fill="#7A1F2B"/>
  <path d="M435.00,243.00 L431.40,234.00 L438.60,234.00 Z" fill="#7A1F2B"/>
  <text x="443.00" y="240.00" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#7A1F2B" text-anchor="start" font-weight="600">right</text>
  <text x="250.00" y="40.00" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#6B7378" text-anchor="middle" font-weight="500">Gap = [left, centre, right], in mm</text>
  <text x="560.00" y="120.00" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#22262A" text-anchor="start" font-weight="500">The two halves sit apart by the</text>
  <text x="560.00" y="143.00" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#22262A" text-anchor="start" font-weight="500">smallest of the three gaps.</text>
  <text x="560.00" y="166.00" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#22262A" text-anchor="start" font-weight="500"></text>
  <text x="560.00" y="189.00" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#22262A" text-anchor="start" font-weight="500">A leg with a larger gap is</text>
  <text x="560.00" y="212.00" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#22262A" text-anchor="start" font-weight="500">ground shorter: in a set the cut</text>
  <text x="560.00" y="235.00" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#22262A" text-anchor="start" font-weight="500">is shared by both halves; with a</text>
  <text x="560.00" y="258.00" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#22262A" text-anchor="start" font-weight="500">plate it is all in the E piece.</text>
  <text x="560.00" y="281.00" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#22262A" text-anchor="start" font-weight="500"></text>
  <text x="560.00" y="304.00" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#22262A" text-anchor="start" font-weight="500">RZ cores: two values, outer</text>
  <text x="560.00" y="327.00" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#22262A" text-anchor="start" font-weight="500">legs and centre post.</text>
  <text x="560.00" y="350.00" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#22262A" text-anchor="start" font-weight="500">IPT: one value, the distance</text>
  <text x="560.00" y="373.00" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#22262A" text-anchor="start" font-weight="500">between the two pads.</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" role="img" aria-label="Air gap: three values, left, centre and right leg">
  <title>Air gap: three values, left, centre and right leg</title>
  <rect width="820" height="470" rx="10" fill="#FFFFFF"/>

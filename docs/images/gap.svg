  <text x="258.00" y="240.00" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#7A1F2B" text-anchor="start" font-weight="600">centre</text>
  <line x1="65.00" y1="227.00" x2="65.00" y2="243.00" stroke="#7A1F2B" stroke-width="1.2"/>
